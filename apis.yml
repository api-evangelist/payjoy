aid: payjoy
name: PayJoy
description: 'PayJoy is a fintech that provides financial access to underserved consumers in emerging
  markets through smartphone financing and a secured credit card that requires only a government ID.
  Its Partner Developer Portal exposes a REST Partner API (Sales Integration) so retail and OEM partners
  can integrate PayJoy point-of-sale financing: retrieve cart and sale information, list merchants and
  sales clerks, offer and process customer repayments, create and pay payment references, redeem and
  cancel vouchers, pay down payments, and pull transaction history for reconciliation. A separate
  E-commerce API supports online checkout and credit-application flows. Authentication is by API key;
  webhooks are HMAC-SHA256 signed. Founded 2015; backed by Greylock and Union Square Ventures.'

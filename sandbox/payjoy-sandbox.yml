model: >-
  PayJoy provisions dedicated, isolated sandbox environments per partner (request via a Key Account
  Manager / Integration Product Manager). Each sandbox has its own Partner Portal URL and its own
  API keys, managed in the sandbox Admin Console. Actions in a sandbox never affect production.
  The published test values below are valid ONLY in sandbox.
sandbox_server: https://partner-integration.sandbox.payjoy.com/partner-api
